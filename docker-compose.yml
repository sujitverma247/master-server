services:
  db:
    image: postgres:16-alpine
    container_name: master-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: master
    volumes:
      - master-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d master"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: master-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      PORT: "8080"
      DATABASE_URL: Host=db;Port=5432;Database=master;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      PRODUCT_SLUG: ${PRODUCT_SLUG:-}
      PRODUCT_DISPLAY_NAME: ${PRODUCT_DISPLAY_NAME:-}
      PRODUCT_APP_KEY: ${PRODUCT_APP_KEY:-}
      PRODUCT_KEY_PREFIX: ${PRODUCT_KEY_PREFIX:-}
      PRODUCT_USER_AGENT_PREFIX: ${PRODUCT_USER_AGENT_PREFIX:-}
      PRODUCT_HMAC_SECRET: ${PRODUCT_HMAC_SECRET:-}
      SEED_LICENSE_KEY: ${SEED_LICENSE_KEY:-}
      SEED_PLAN_TYPE: ${SEED_PLAN_TYPE:-1year}
      SEED_MAX_MACHINES: ${SEED_MAX_MACHINES:-3}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_DISPLAY_NAME: ${ADMIN_SEED_DISPLAY_NAME:-}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      GATEWAY_DEFAULT: ${GATEWAY_DEFAULT:-dev}
      GATEWAY_DEV_SECRET: ${GATEWAY_DEV_SECRET:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      HEARTBEAT_STALE_HOURS: ${HEARTBEAT_STALE_HOURS:-72}

volumes:
  master-data:
